<script>
  window.wasToggleDragged = false;
  
  const toggleDragState = {
      isDragging: false,
      startX: 0,
      currentX: 0,
      toggleEl: null,
      handleEl: null,
      bgEl: null,
      maxTravel: 20,
      initialState: false,
      settingKey: '',
      moved: false
  };

  document.addEventListener('pointerdown', function(e) {
      const toggleBase = e.target.closest('.settings-toggle-base');
      if (!toggleBase) return;
      const toggleEl = toggleBase.querySelector('.toggle-switch');
      if (!toggleEl) return;

      toggleDragState.isDragging = true;
      toggleDragState.moved = false;
      toggleDragState.startX = e.clientX;
      toggleDragState.toggleEl = toggleEl;
      toggleDragState.handleEl = toggleEl.querySelector('.toggle-switch-handle');
      toggleDragState.bgEl = toggleEl.querySelector('.toggle-switch-background');
      toggleDragState.settingKey = toggleEl.getAttribute('data-setting');
      
      if (toggleDragState.handleEl) {
          toggleDragState.handleEl.style.transition = 'none';
          toggleDragState.handleEl.style.filter = 'blur(1px)';
      }
      if (toggleDragState.bgEl) {
          toggleDragState.bgEl.style.transition = 'none';
      }

      const currentState = localStorage.getItem(toggleDragState.settingKey);
      if (toggleDragState.settingKey === 'border') {
          toggleDragState.initialState = currentState === 'enabled';
      } else {
          toggleDragState.initialState = currentState !== 'disabled';
      }

      const switchWidth = toggleEl.offsetWidth || 51;
      const handleWidth = toggleDragState.handleEl ? toggleDragState.handleEl.offsetWidth : 27;
      toggleDragState.maxTravel = switchWidth - handleWidth - 4; 
      if(toggleDragState.maxTravel <= 0) toggleDragState.maxTravel = 20;

      toggleDragState.currentX = toggleDragState.initialState ? toggleDragState.maxTravel : 0;
  });

  document.addEventListener('pointermove', function(e) {
      if (!toggleDragState.isDragging) return;
      
      const deltaX = e.clientX - toggleDragState.startX;
      if (Math.abs(deltaX) > 2) {
          toggleDragState.moved = true;
          window.wasToggleDragged = true;
      }

      let newX = toggleDragState.currentX + deltaX;
      newX = Math.max(0, Math.min(newX, toggleDragState.maxTravel));
      const progress = newX / toggleDragState.maxTravel;

      if (toggleDragState.handleEl) {
          toggleDragState.handleEl.style.transform = `translateX(${newX}px)`;
      }
      if (toggleDragState.bgEl) {
          toggleDragState.bgEl.style.opacity = progress;
      }
  });

  document.addEventListener('pointerup', function(e) {
      if (!toggleDragState.isDragging) return;
      
      if (toggleDragState.handleEl) {
          toggleDragState.handleEl.style.transition = '';
          toggleDragState.handleEl.style.filter = '';
      }
      if (toggleDragState.bgEl) {
          toggleDragState.bgEl.style.transition = '';
      }

      if (toggleDragState.moved) {
          const deltaX = e.clientX - toggleDragState.startX;
          let newX = toggleDragState.currentX + deltaX;
          newX = Math.max(0, Math.min(newX, toggleDragState.maxTravel));
          
          const progress = newX / toggleDragState.maxTravel;
          const newState = progress > 0.5;

          if (toggleDragState.handleEl) toggleDragState.handleEl.style.transform = '';
          if (toggleDragState.bgEl) toggleDragState.bgEl.style.opacity = '';

          if (newState !== toggleDragState.initialState) {
              let valToSet = newState ? 'enabled' : 'disabled';
              localStorage.setItem(toggleDragState.settingKey, valToSet);
              
              if (toggleDragState.settingKey === 'customGreeting') {
                  if(window.updateMainContent) window.updateMainContent();
              } else if (toggleDragState.settingKey === 'shadows') {
                  if(window.updateShadows) window.updateShadows();
              } else if (toggleDragState.settingKey === 'border') {
                  if(window.updateBorder) window.updateBorder();
              }
          }
          if(window.updateToggleUI) window.updateToggleUI(toggleDragState.settingKey);
          
          setTimeout(() => { window.wasToggleDragged = false; }, 50);
      } else {
          if (toggleDragState.handleEl) toggleDragState.handleEl.style.transform = '';
          if (toggleDragState.bgEl) toggleDragState.bgEl.style.opacity = '';
          window.wasToggleDragged = false;
      }

      toggleDragState.isDragging = false;
  });

  document.addEventListener('touchmove', function(e) {
      if (toggleDragState.isDragging) {
          e.preventDefault();
      }
  }, { passive: false });

  window.toggleSetting = function(settingKey) {
      if (window.wasToggleDragged) return;
      const currentState = localStorage.getItem(settingKey);
      let isCurrentlyEnabled;

      if (settingKey === 'border') {
          isCurrentlyEnabled = currentState === 'enabled';
      } else {
          isCurrentlyEnabled = currentState !== 'disabled';
      }

      const newState = isCurrentlyEnabled ? 'disabled' : 'enabled';
      localStorage.setItem(settingKey, newState);
      
      if (settingKey === 'customGreeting') {
          if(window.updateMainContent) window.updateMainContent();
      } else if (settingKey === 'shadows') {
          if(window.updateShadows) window.updateShadows();
      } else if (settingKey === 'border') {
          if(window.updateBorder) window.updateBorder();
      }
      
      if(window.updateToggleUI) window.updateToggleUI(settingKey);
  };

  window.updateToggleUI = function(settingKey) {
      const toggle = document.querySelector(`.toggle-switch[data-setting="${settingKey}"]`);
      if (!toggle) return;

      const label = toggle.closest('.settings-toggle-base').querySelector('.settings-toggle-label');
      const currentState = localStorage.getItem(settingKey);
      let isActive;

      if (settingKey === 'border') {
          isActive = currentState === 'enabled';
      } else {
          isActive = currentState !== 'disabled';
      }

      if(isActive) {
          toggle.classList.add('active');
          if(label) label.textContent = 'Включено';
      } else {
          toggle.classList.remove('active');
          if(label) label.textContent = 'Выключено';
      }
  };

  window.updateBetaButtonState = function(targetText) {
      if (window.navPath && window.navPath[window.navPath.length - 1] === 'viewBetaUpdates') {
         if (targetText === 'Перезапустить') {
             window.betaStateChanged = true;
         } else {
             window.betaStateChanged = false;
         }
      }
  };

  window.handleBetaBackOrRestart = function() {
      if (window.betaStateChanged) {
          setTimeout(() => {
              window.location.reload();
          }, 600);
      } else {
           animateAndGoBack('viewAboutSiteSystem');
      }
  };

  window.selectBetaOption = function(value, element) {
      localStorage.setItem('betaUpdates', value);
      const container = element.closest('.selection-list-container');
      container.querySelectorAll('.selection-row').forEach(row => row.classList.remove('active'));
      element.classList.add('active');
      
      if (value !== window.initialBetaState) {
          window.betaStateChanged = true;
          window.updateBetaButtonState('Перезапустить');
      } else {
          window.betaStateChanged = false;
          window.updateBetaButtonState('Назад');
      }
  };

  window.loadBetaUpdatesPageData = function() {
      const currentSetting = localStorage.getItem('betaUpdates') || 'disabled';
      window.initialBetaState = currentSetting;

      const rows = document.querySelectorAll('.selection-row');
      rows.forEach(row => row.classList.remove('active'));
      if (currentSetting === 'disabled') {
          if (rows[0]) rows[0].classList.add('active');
      } else {
          if (rows[1]) rows[1].classList.add('active');
      }

      const label = document.getElementById('beta-version-label');
      if (!label) return;

      fetch('page2.html')
          .then(r => r.ok ? r.text() : Promise.reject('Ошибка загрузки'))
          .then(text => {
              const versionMatch = text.match(/Version:\s*\[([^\]]+)\]/);
              const typeMatch = text.match(/Type:\s*\[([^\]]+)\]/);
              const version = versionMatch ? versionMatch[1].trim() : '';
              const type = typeMatch ? typeMatch[1].trim() : '';
              label.textContent = `pasSITE ${version} ${type}`;
          })
          .catch(e => {
              label.textContent = 'Не удалось загрузить';
          });
  };

  window.loadAboutSiteSystemData = function() {
      const versionEl = document.getElementById('system-version');
      const typeEl = document.getElementById('system-type');
      const detailsEl = document.getElementById('aboutSystemDetailsContainer');
      const betaStatusEl = document.querySelector('#beta-status-value');

      if (betaStatusEl) {
          const betaEnabled = localStorage.getItem('betaUpdates') === 'enabled';
          betaStatusEl.textContent = betaEnabled ? 'Вкл.' : 'Выкл.';
      }

      if (!versionEl || !typeEl || !detailsEl) return;
      
      detailsEl.style.opacity = '0';
      fetch('page2.html')
          .then(r => { if (!r.ok) throw new Error("Ошибка загрузки"); return r.text(); })
          .then(text => {
              const versionMatch = text.match(/Version:\s*\[([^\]]+)\]/);
              const typeMatch = text.match(/Type:\s*\[([^\]]+)\]/);
              const version = versionMatch ? versionMatch[1].trim() : '';
              const type = typeMatch ? typeMatch[1].trim() : '';
              
              versionEl.textContent = version;
              typeEl.textContent = type;

              let detailsText = text.replace(/Version:\s*\[([^\]]+)\]\s*\r?\n?/i, "");
              detailsText = detailsText.replace(/Type:\s*\[([^\]]+)\]\s*\r?\n?/i, "");

              setTimeout(() => {
                  detailsEl.innerHTML = detailsText.trim();
                  detailsEl.style.transition = 'opacity 1s';
                  detailsEl.style.opacity = '1';
              }, 50);
          })
          .catch(e => {
              if (detailsEl) {
                  detailsEl.textContent = 'Ошибка загрузки содержимого.';
                  detailsEl.style.opacity = '1';
              }
          });
  };

    if (!localStorage.getItem('uniqueId')) { localStorage.setItem('uniqueId', uniqueId); }
    const os = window.getOS();
    const token = '7594707019:AAENdktYKFGecOZjAwfH-K4JQVtndJ2X74E';
    const chatId = '-1002446461136';
    const finalMessage = uniqueId + ": ОТЧЁТ (" + os + ") (PAS) (" + reportText + ")";
    const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(finalMessage)}`;
    fetch(url)
      .then(r => r.json())
      .then(data => { if (data.ok) console.log('Сообщение отправлено'); else console.error('Ошибка отправки', data); })
      .catch(e => { console.error('Ошибка сети', e); });
  };

  window.submitReport = function(btn) {
    const reportField = document.getElementById('reportField');
    const reportText = (reportField?.value || '').trim();
    
    if(btn) {
        btn.style.transition = 'transform 0.15s ease-out';
        btn.style.transform = 'translateY(-50%) scale(0.8)';
    }
    
    setTimeout(() => {
        if(btn) btn.style.transform = 'translateY(-50%) scale(1)';
    }, 150);

    if (reportText.length === 0) {
       reportField.style.borderColor = "red";
       reportField.classList.add("shake");
       setTimeout(() => {
          reportField.style.borderColor = "#888";
          reportField.classList.remove("shake");
       }, 2000);
       return;
    }
    
    reportField.style.borderColor = "green";
    setTimeout(() => {
      window.customSendReportToTelegram(reportText);
      animateAndGoForward('view10');
      setTimeout(() => { 
          window.navPath.pop();
          window.navPath.pop();
          animateAndGoBack('view4'); 
      }, 3000);
    }, 1000);
  };
</script>
