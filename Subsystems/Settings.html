<style>
.toggle-switch {
  width: 51px;
  height: 31px;
  background-color: rgba(120, 120, 128, 0.32);
  border-radius: 15.5px;
  position: relative;
  cursor: pointer;
  box-sizing: border-box;
}
.toggle-switch-background {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #34C759;
  border-radius: 15.5px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.toggle-switch-handle {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  background-color: #fff;
  border-radius: 50%;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16), 0 3px 1px rgba(0,0,0,0.1);
  transition: transform 0.3s cubic-bezier(0.2, 0.85, 0.32, 1.2);
  z-index: 1;
}
.toggle-switch.active .toggle-switch-background {
  opacity: 1;
}
.toggle-switch.active .toggle-switch-handle {
  transform: translateX(20px);
}
.settings-toggle-base {
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
}
.settings-toggle-label {
  flex-grow: 1;
  text-align: left;
}
</style>
