<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face ID Simulation</title>
    <style>
        /* Легкий iOS-подобный стиль */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: 320px;
            box-sizing: border-box;
            position: relative;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        h1, h2 {
            color: #000;
            margin-bottom: 10px;
        }

        p {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Синяя кнопка в стиле iOS */
        .primary-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }

        .primary-btn:active {
            background-color: #0056b3;
        }

        /* Кнопка-крестик */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e5e5ea;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #48484a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .close-btn:active {
            background: #d1d1d6;
        }

        .status-badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="main-screen" class="card">
        <h1>Привет</h1>
        <p>Нажми кнопку ниже, чтобы настроить вход через Face ID устройства.</p>
        <button id="auth-btn" class="primary-btn">Создать ключ безопасности</button>
    </div>

    <div id="dev-menu" class="card hidden">
        <button class="close-btn" id="close-btn">×</button>
        <h2>Меню разработчика</h2>
        <p>Доступ получен. Нативная система безопасности iOS подтвердила твою личность.</p>
        <div class="status-badge">Ключ в localStorage</div>
    </div>

    <script>
        const authBtn = document.getElementById('auth-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainScreen = document.getElementById('main-screen');
        const devMenu = document.getElementById('dev-menu');

        // Клик по кнопке "Создать ключ безопасности"
        authBtn.addEventListener('click', async () => {
            
            // Проверяем, поддерживает ли браузер вообще WebAuthn
            if (!window.PublicKeyCredential) {
                alert("К сожалению, этот браузер или устройство не поддерживают аппаратные ключи безопасности.");
                return;
            }

            // Генерируем случайные байты (требование протокола WebAuthn для защиты от повторов)
            const randomChallenge = new Uint8Array(32);
            window.crypto.getRandomValues(randomChallenge);
            
            const randomUserId = new Uint8Array(16);
            window.crypto.getRandomValues(randomUserId);

            // Конфигурация для вызова системного Face ID / Passkey
            const publicKeyCredentialCreationOptions = {
                challenge: randomChallenge,
                rp: {
                    name: "Локальный симулятор",
                    id: window.location.hostname // Должен совпадать с текущим доменом/localhost
                },
                user: {
                    id: randomUserId,
                    name: "developer@ios.sim",
                    displayName: "Разработчик"
                },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }], // Алгоритм ES256 (стандарт для Apple)
                authenticatorSelection: {
                    authenticatorAttachment: "platform", // Магия тут: заставляет iOS вызвать FaceID/TouchID текущего девайса
                    userVerification: "required" // Обязательное подтверждение биометрией
                },
                timeout: 60000
            };

            try {
                // Вызываем системное окно iOS
                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                // Если юзер приложил лицо/ввел код-пароль и iOS дала добро:
                if (credential) {
                    // Сохраняем ID ключа в localStorage (как текстовый симулятор успешной связки)
                    localStorage.setItem('ios_mock_cred_id', credential.id);
                    localStorage.setItem('ios_auth_status', 'verified');

                    // Переключаем экраны
                    mainScreen.classList.add('hidden');
                    devMenu.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Ошибка авторизации:", error);
                alert("iOS отклонила запрос или операция была отменена: " + error.message);
            }
        });

        // Клик по крестику — возвращаемся обратно
        closeBtn.addEventListener('click', () => {
            devMenu.classList.add('hidden');
            mainScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
