<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Liquid Glass Auth</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-highlight: inset 0 1px 2px rgba(255, 255, 255, 0.65), inset 0 -1px 1px rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #09090e;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* Жидкие цветные сферы на фоне для создания эффекта преломления стекла */
        .bg-blur-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff2d55 0%, rgba(255,45,85,0) 70%);
            top: -100px;
            left: -100px;
            filter: blur(50px);
            opacity: 0.6;
            animation: float 12s infinite alternate;
        }

        .bg-blur-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #5856d6 0%, rgba(88,86,214,0) 70%);
            bottom: -150px;
            right: -100px;
            filter: blur(60px);
            opacity: 0.6;
            animation: float 18s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.1); }
        }

        /* Карточка из жидкого стекла */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), var(--glass-highlight);
            border-radius: 32px;
            padding: 35px 25px;
            text-align: center;
            width: 340px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.95);
        }

        h1 {
            color: var(--text-color);
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Кнопки в стиле iOS */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px 20px;
            font-size: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: var(--glass-highlight);
            margin-bottom: 12px;
            backdrop-filter: blur(5px);
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.98);
        }

        /* Акцентная кнопка */
        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        .btn-primary:active {
            background: rgba(255, 255, 255, 0.85);
        }

        /* Кнопка закрытия/блокировки */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: var(--glass-highlight);
        }

        .close-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .badge {
            display: inline-block;
            background: rgba(52, 199, 89, 0.2);
            border: 1px solid rgba(52, 199, 89, 0.4);
            color: #34c759;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="bg-blur-1"></div>
    <div class="bg-blur-2"></div>

    <div id="auth-screen" class="glass-card">
        <h1>Привет</h1>
        <p class="subtitle">Создай ключ или используй Face ID для мгновенного входа в систему безопасности.</p>
        
        <button id="login-btn" class="btn btn-primary">Войти по Face ID</button>
        <button id="register-btn" class="btn">Создать ключ доступа</button>
    </div>

    <div id="main-menu" class="glass-card hidden">
        <button class="close-btn" id="lock-btn">×</button>
        <h1>Главное меню</h1>
        <p class="subtitle">Добро пожаловать в панель разработчика. Доступ успешно подтвержден через iOS Face ID.</p>
        <div class="badge">Защищено WebAuthn</div>
    </div>

    <script>
        const registerBtn = document.getElementById('register-btn');
        const loginBtn = document.getElementById('login-btn');
        const lockBtn = document.getElementById('lock-btn');
        const authScreen = document.getElementById('auth-screen');
        const mainMenu = document.getElementById('main-menu');

        // Вспомогательная функция переключения экранов
        function showScreen(screenToShow, screenToHide) {
            screenToHide.classList.add('hidden');
            setTimeout(() => {
                screenToShow.classList.remove('hidden');
            }, 100);
        }

        // ================= СЦЕНАРИЙ 1: СОЗДАНИЕ КЛЮЧА =================
        registerBtn.addEventListener('click', async () => {
            if (!window.PublicKeyCredential) {
                alert("WebAuthn не поддерживается");
                return;
            }

            const randomBuffer = new Uint8Array(32);
            window.crypto.getRandomValues(randomBuffer);

            const creationOptions = {
                challenge: randomBuffer,
                rp: { name: "iOS Simulation", id: window.location.hostname },
                user: {
                    id: new Uint8Array([1, 2, 3, 4]),
                    name: "dev@ios26.local",
                    displayName: "iOS 26 Developer"
                },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: {
                    authenticatorAttachment: "platform",
                    userVerification: "required"
                },
                timeout: 60000
            };

            try {
                const credential = await navigator.credentials.create({ publicKey: creationOptions });
                if (credential) {
                    // Имитируем сохранение ключа
                    localStorage.setItem('has_passkey', 'true');
                    alert("Ключ безопасности успешно создан и сохранен в связку ключей iOS!");
                }
            } catch (err) {
                console.error(err);
                alert("Ошибка создания ключа: " + err.message);
            }
        });

        // ================= СЦЕНАРИЙ 2: ВХОД ПО FACE ID =================
        loginBtn.addEventListener('click', async () => {
            if (!window.PublicKeyCredential) {
                alert("WebAuthn не поддерживается");
                return;
            }

            const randomBuffer = new Uint8Array(32);
            window.crypto.getRandomValues(randomBuffer);

            // Опции запроса ключа у iOS
            const requestOptions = {
                challenge: randomBuffer,
                rpId: window.location.hostname,
                userVerification: "required" // Требуем именно Face ID / Touch ID / Код-пароль
            };

            try {
                // Вызываем шторку проверки существующего ключа
                const assertion = await navigator.credentials.get({ publicKey: requestOptions });
                
                if (assertion) {
                    // Если биометрия совпала, iOS отдает валидный объект
                    showScreen(mainMenu, authScreen);
                }
            } catch (err) {
                console.error(err);
                alert("Доступ отклонен или ключ не найден. Сначала создайте ключ. Ошибка: " + err.message);
            }
        });

        // Кнопка закрытия (Заблокировать обратно)
        lockBtn.addEventListener('click', () => {
            showScreen(authScreen, mainMenu);
        });
    </script>
</body>
</html>
